# Smart Laundry Facility Configuration

# Resources
washer.count=6
dryer.count=4
kiosk.count=2
customer.count=50

# Timings (milliseconds)
wash.min=4000
wash.max=6000

dry.min=3000
dry.max=5000

payment.min=1000
payment.max=2000

# Customer arrival gap
# Assignment requirement: customers arrive randomly every 0-3 seconds.
arrival.min=0
arrival.max=3000

# Failure rates (percentage)
# 5% chance of washer failure during washing.
# 5% chance of payment kiosk failure.
washer.fail.rate=5
payment.fail.rate=5

# Payment retry delay after kiosk failure
retry.delay=2000

# Bonus: Congested Scenario
# Both payment kiosks are unavailable.
# Owner is called when 30 customers are waiting at the payment queue.
congestion.threshold=30

# Assumption for terminating the congested scenario.
# After the owner is called, waiting customers are given additional time
# before the simulation ends.
congestion.abandon.delay=5000

# Simulation
# Assignment states that the simulation should run about 60 seconds.
simulation.seconds=60